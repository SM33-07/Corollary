services:
  postgres:
    image: postgres:16-alpine
    container_name: query_advisor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_password
      POSTGRES_DB: query_advisor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
